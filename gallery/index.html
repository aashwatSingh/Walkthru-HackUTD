<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough: project gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--card:#0f0c1b;--line:rgb(168 85 247/.22);--ink:#ece9f7;--muted:#a29bbd;--neon:#00f0ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a1130,transparent 70%),var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
header{max-width:1200px;margin:0 auto;padding:48px 24px 8px}
.k{font:500 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--neon)}
h1{font-size:clamp(2rem,4vw,3.2rem);margin:.3em 0 .2em;letter-spacing:-.02em}
header p{color:var(--muted);max-width:62ch;line-height:1.55;margin:0}
header a{color:var(--neon)}
main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:rgb(34 211 238/.6)}
.card img{cursor:zoom-in;display:block;width:100%;height:220px;object-fit:cover;object-position:top;background:#000}
.card.phone img{object-fit:contain}
figcaption{padding:12px 14px 14px;display:grid;gap:4px}
figcaption b{font-size:15px}figcaption span{color:var(--muted);font-size:13.5px;line-height:1.45}
footer{max-width:1200px;margin:0 auto;padding:8px 24px 48px;color:var(--muted);font:12px "JetBrains Mono",monospace}
#lb{position:fixed;inset:0;background:rgb(7 6 11/.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;z-index:10}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:6px}</style></head><body>
<header><div class="k">WALKTHROUGH // PROJECT GALLERY</div><h1>Tamper-proof move-in and move-out records</h1>
<p>A live-camera inspection app for university housing, reviewed by an NVIDIA Nemotron agent. Click any screenshot to see it full size. Live app: <a href="https://walkthru-ashy.vercel.app">walkthru-ashy.vercel.app</a></p></header>
<main><figure class="card"><img src="01-landing-hero.jpg" alt="Landing page" loading="lazy"><figcaption><b>Landing page</b><span>The pitch, with a locked case file from a real move-out.</span></figcaption></figure><figure class="card"><img src="02-landing-evidence.jpg" alt="Evidence that holds up" loading="lazy"><figcaption><b>Evidence that holds up</b><span>Move-in vs. move-out, fingerprinted and locked by the database.</span></figcaption></figure><figure class="card"><img src="03-landing-nemotron.jpg" alt="An inspection agent, not a chatbot" loading="lazy"><figcaption><b>An inspection agent, not a chatbot</b><span>How the NVIDIA Nemotron agent plans the review and calls tools.</span></figcaption></figure><figure class="card phone"><img src="04-login-phone.jpg" alt="Secure login" loading="lazy"><figcaption><b>Secure login</b><span>University email, password, then a 2FA code.</span></figcaption></figure><figure class="card phone"><img src="05-camera-viewfinder-phone.jpg" alt="Live camera viewfinder" loading="lazy"><figcaption><b>Live camera viewfinder</b><span>Live camera only, no camera-roll uploads. Unit, timestamp and capture mode on screen.</span></figcaption></figure><figure class="card phone"><img src="06-photo-coach-phone.jpg" alt="Photo coach" loading="lazy"><figcaption><b>Photo coach</b><span>Each photo is stored with a server timestamp and SHA-256 fingerprint; Nemotron checks framing, light and focus.</span></figcaption></figure><figure class="card phone"><img src="07-student-summary-phone.jpg" alt="Student summary" loading="lazy"><figcaption><b>Student summary</b><span>Charges, waivers and disputes, with both photos side by side.</span></figcaption></figure><figure class="card"><img src="08-admin-dashboard.jpg" alt="Housing dashboard" loading="lazy"><figcaption><b>Housing dashboard</b><span>Totals, charts, every room and every item at a glance.</span></figcaption></figure><figure class="card"><img src="09-comparator-side-by-side.jpg" alt="Side-by-side comparator" loading="lazy"><figcaption><b>Side-by-side comparator</b><span>Both photos with their capture times, fingerprint checks and the student dispute.</span></figcaption></figure><figure class="card"><img src="10-comparator-slider.jpg" alt="Laser slider" loading="lazy"><figcaption><b>Laser slider</b><span>Wipe between move-in and move-out to spot the change.</span></figcaption></figure><figure class="card"><img src="11-nemotron-agent-trace.jpg" alt="Nemotron agent trace" loading="lazy"><figcaption><b>Nemotron agent trace</b><span>Every planning round and tool call, run in parallel and timed.</span></figcaption></figure><figure class="card"><img src="12-nemotron-suggestions.jpg" alt="Suggestions by item" loading="lazy"><figcaption><b>Suggestions by item</b><span>Status, confidence and rationale. Fees come from the schedule; an admin approves each one.</span></figcaption></figure><figure class="card"><img src="13-qr-door-flyer.jpg" alt="Door QR codes" loading="lazy"><figcaption><b>Door QR codes</b><span>Print one per room. Scanning it opens that room on the student&#x27;s phone.</span></figcaption></figure><figure class="card"><img src="14-inspection-report.jpg" alt="Inspection report" loading="lazy"><figcaption><b>Inspection report</b><span>The full record for one room, with timestamps and fingerprints.</span></figcaption></figure><figure class="card"><img src="15-report-printed.jpg" alt="Printed report" loading="lazy"><figcaption><b>Printed report</b><span>Prints black on white as an official record.</span></figcaption></figure></main>
<footer>Screenshots taken in demo mode, with sample data.</footer><div id="lb" role="dialog" aria-label="Screenshot"><img alt=""></div><script>const lb=document.getElementById("lb"),big=lb.querySelector("img");document.querySelectorAll(".card img").forEach(i=>i.addEventListener("click",()=>{big.src=i.src;big.alt=i.alt;lb.classList.add("on")}));lb.addEventListener("click",()=>lb.classList.remove("on"));addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("on")});</script></body></html>
