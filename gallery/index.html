<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough: project gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--card:#0f0c1b;--line:rgb(168 85 247/.22);--ink:#ece9f7;--muted:#a29bbd;--neon:#00f0ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a1130,transparent 70%),var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif}
header{max-width:1200px;margin:0 auto;padding:48px 24px 8px}
.k{font:500 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--neon)}
h1{font-size:clamp(2rem,4vw,3.2rem);margin:.3em 0 .2em;letter-spacing:-.02em}
header p{color:var(--muted);max-width:62ch;line-height:1.55;margin:0}
header a{color:var(--neon)}
main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:rgb(34 211 238/.6)}
.card img{cursor:zoom-in;display:block;width:100%;height:220px;object-fit:cover;object-position:top;background:#000}
.card.phone img{object-fit:contain}
figcaption{padding:12px 14px 14px;display:grid;gap:4px}
figcaption b{font-size:15px}figcaption span{color:var(--muted);font-size:13.5px;line-height:1.45}
footer{max-width:1200px;margin:0 auto;padding:8px 24px 48px;color:var(--muted);font:12px "JetBrains Mono",monospace}
#lb{position:fixed;inset:0;background:rgb(7 6 11/.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;z-index:10}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:6px}</style></head><body>
<header><div class="k">WALKTHROUGH // PROJECT GALLERY</div><h1>Tamper-proof move-in and move-out records</h1>
<p>A live-camera inspection app for university housing, reviewed by an NVIDIA Nemotron agent. Click any screenshot to see it full size. Live app: <a href="https://walkthru-ashy.vercel.app">walkthru-ashy.vercel.app</a></p></header>
<main><figure class="card"><img src="01-landing-hero.jpg" alt="Landing page" loading="lazy"><figcaption><b>Landing page</b><span>Drag the divider to compare a real move-in and move-out photo.</span></figcaption></figure><figure class="card"><img src="02-landing-how-it-works.jpg" alt="How it works" loading="lazy"><figcaption><b>How it works</b><span>Press the shutter, lock it, then try to edit it: the database says no.</span></figcaption></figure><figure class="card"><img src="03-landing-fingerprint-lab.jpg" alt="Fingerprint lab" loading="lazy"><figcaption><b>Fingerprint lab</b><span>Real SHA-256 of the real file. Change one bit and it no longer matches.</span></figcaption></figure><figure class="card"><img src="04-landing-nemotron.jpg" alt="Nemotron agent" loading="lazy"><figcaption><b>Nemotron agent</b><span>The agent trace, played back step by step.</span></figcaption></figure><figure class="card"><img src="05-landing-faq.jpg" alt="Questions" loading="lazy"><figcaption><b>Questions</b><span>Straight answers about what the app does and does not do.</span></figcaption></figure><figure class="card"><img src="06-login.jpg" alt="Sign in" loading="lazy"><figcaption><b>Sign in</b><span>Password sign-in, plus one-click demo users.</span></figcaption></figure><figure class="card"><img src="07-two-factor.jpg" alt="Two-factor code" loading="lazy"><figcaption><b>Two-factor code</b><span>Six boxes that light up as the code is typed.</span></figcaption></figure><figure class="card phone"><img src="08-wizard-start-phone.jpg" alt="Guided inspection" loading="lazy"><figcaption><b>Guided inspection</b><span>One checklist item per screen, on the student’s phone.</span></figcaption></figure><figure class="card phone"><img src="09-photo-coach-phone.jpg" alt="Photo coach" loading="lazy"><figcaption><b>Photo coach</b><span>Nemotron checks each photo and suggests a retake.</span></figcaption></figure><figure class="card phone"><img src="10-lock-confirm-phone.jpg" alt="Lock and submit" loading="lazy"><figcaption><b>Lock and submit</b><span>A last look at every photo before it becomes permanent.</span></figcaption></figure><figure class="card phone"><img src="11-locked-phone.jpg" alt="Locked record" loading="lazy"><figcaption><b>Locked record</b><span>After submit, nobody can change it.</span></figcaption></figure><figure class="card phone"><img src="12-student-summary-phone.jpg" alt="Student summary" loading="lazy"><figcaption><b>Student summary</b><span>Before and after for every item, with charges and disputes.</span></figcaption></figure><figure class="card"><img src="13-admin-dashboard.jpg" alt="Housing dashboard" loading="lazy"><figcaption><b>Housing dashboard</b><span>Numbers, charts and room cards all filter the table.</span></figcaption></figure><figure class="card"><img src="14-admin-filtered.jpg" alt="Filtered table" loading="lazy"><figcaption><b>Filtered table</b><span>One click on “Active disputes” shows only those rows.</span></figcaption></figure><figure class="card"><img src="15-comparator.jpg" alt="Comparator" loading="lazy"><figcaption><b>Comparator</b><span>Both photos, their fingerprints, and the decision.</span></figcaption></figure><figure class="card"><img src="16-comparator-slider.jpg" alt="Comparator slider" loading="lazy"><figcaption><b>Comparator slider</b><span>Drag across the photo to wipe between move-in and move-out.</span></figcaption></figure><figure class="card"><img src="17-nemotron-running.jpg" alt="Review running" loading="lazy"><figcaption><b>Review running</b><span>The agent plans the review and calls its tools.</span></figcaption></figure><figure class="card"><img src="18-nemotron-review.jpg" alt="Nemotron review" loading="lazy"><figcaption><b>Nemotron review</b><span>Summary, timeline with durations, and a suggestion per item.</span></figcaption></figure><figure class="card"><img src="19-qr-door-flyer.jpg" alt="Door QR codes" loading="lazy"><figcaption><b>Door QR codes</b><span>Pick a room, print its flyer.</span></figcaption></figure><figure class="card"><img src="20-inspection-report.jpg" alt="Inspection report" loading="lazy"><figcaption><b>Inspection report</b><span>The official record; prints black on white.</span></figcaption></figure></main>
<footer>Screenshots taken in demo mode, with sample data.</footer><div id="lb" role="dialog" aria-label="Screenshot"><img alt=""></div><script>const lb=document.getElementById("lb"),big=lb.querySelector("img");document.querySelectorAll(".card img").forEach(i=>i.addEventListener("click",()=>{big.src=i.src;big.alt=i.alt;lb.classList.add("on")}));lb.addEventListener("click",()=>lb.classList.remove("on"));addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("on")});</script></body></html>
